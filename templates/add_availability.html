{% extends 'base.html' %}

{% block title %}Add Availability | Smart Study Planner{% endblock %}

{% block page_heading %}Add Study Availability{% endblock %}

{% block content %}
<div class="container">


    {% if error %}
    <p class="error-message">{{ error }}</p>
    {% endif %}
    <form method="POST">

        <label>
            Date
        </label>

        <br>

        <input type="date" id="available_date" name="available_date" value="{{ form_data.available_date }}" required>

        <br><br>


        <label>
            Available Hours
        </label>

        <br>

        <input type="number" id="available_hours" name="available_hours" min="0.5" max="24" step="0.5"
            value="{{ form_data.available_hours }}" required>

        <br><br>


        <label>
            Start Time
        </label>

        <br>

        <input type="time" name="start_time">

        <br><br>


        <label>
            End Time
        </label>

        <br>

        <input type="time" name="end_time">

        <br><br>


        <button type="submit">
            Add Availability
        </button>

    </form>

    <br>

    <a href="{{ url_for('availability') }}">
        Back to Availability
    </a>

</div>
{% endblock %}
