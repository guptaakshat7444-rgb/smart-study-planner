{% extends 'base.html' %}

{% block title %}Add Topic | Smart Study Planner{% endblock %}

{% block page_heading %}Add Topic{% endblock %}

{% block content %}
<div class="container">
    <h2>{{ subject["name"] }}</h2>

    {% if error %}
        <p class="error-message" role="alert">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label for="topic-name">Topic Name</label>
        <br>
        <input
            type="text"
            id="topic-name"
            name="name"
            placeholder="Enter topic name"
            value="{{ form_data.name }}"
            required
        >

        <br><br>

        <label for="topic-description">Description</label>
        <br>
        <textarea
            id="topic-description"
            name="description"
            placeholder="Enter topic description"
        >{{ form_data.description }}</textarea>

        <br><br>

        <label for="topic-difficulty">Difficulty (1-5)</label>
        <br>
        <input
            type="number"
            id="topic-difficulty"
            name="difficulty"
            min="1"
            max="5"
            step="1"
            value="{{ form_data.difficulty }}"
            required
        >

        <br><br>

        <label for="topic-priority">Priority (1-5)</label>
        <br>
        <input
            type="number"
            id="topic-priority"
            name="priority"
            min="1"
            max="5"
            step="1"
            value="{{ form_data.priority }}"
            required
        >

        <br><br>

        <label for="topic-hours">Estimated Hours</label>
        <br>
        <input
            type="number"
            id="topic-hours"
            name="estimated_hours"
            min="0.5"
            step="0.5"
            placeholder="Example: 4"
            value="{{ form_data.estimated_hours }}"
            required
        >

        <br><br>

        <button type="submit">Add Topic</button>
    </form>

    <br>

    <a href="{{ url_for(
        'topics',
        subject_id=subject['subject_id']
    ) }}">
        Back to Topics
    </a>
</div>
{% endblock %}
