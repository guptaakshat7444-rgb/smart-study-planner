{% extends 'base.html' %}

{% block title %}Add Topic | Smart Study Planner{% endblock %}

{% block page_heading %}Add Topic{% endblock %}

{% block content %}
<div class="container">

        

        <h2>{{ subject["name"] }}</h2>

        <form method="POST">

            <label>Topic Name</label>
            <br>

            <input
                type="text"
                name="name"
                placeholder="Enter topic name"
                required
            >

            <br><br>

            <label>Description</label>
            <br>

            <textarea
                name="description"
                placeholder="Enter topic description"
            ></textarea>

            <br><br>

            <label>Difficulty (1-5)</label>
            <br>

            <input
                type="number"
                name="difficulty"
                min="1"
                max="5"
                value="3"
                required
            >

            <br><br>

            <label>Priority (1-5)</label>
            <br>

            <input
                type="number"
                name="priority"
                min="1"
                max="5"
                value="3"
                required
            >

            <br><br>

            <label>Estimated Hours</label>
            <br>

            <input
                type="number"
                name="estimated_hours"
                min="0.5"
                step="0.5"
                placeholder="Example: 4"
                required
            >

            <br><br>

            <button type="submit">
                Add Topic
            </button>

        </form>

        <br>

        <a href="{{ url_for('topics',
                            subject_id=subject['subject_id']) }}">
            Back to Topics
        </a>

    </div>
{% endblock %}
